# Local stack: docker compose up --build
# Dashboard http://localhost:5173 · API http://localhost:4000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: consentflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/consentflow
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:5173}
      ALLOW_GEO_OVERRIDE: "true"
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }

  scanner:
    build: { context: ., dockerfile: docker/scanner.Dockerfile }
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/consentflow
    depends_on: [api]
    ipc: host

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
      args: { VITE_API_URL: "${PUBLIC_API_URL:-http://localhost:4000}" }
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
